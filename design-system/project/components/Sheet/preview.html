<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sheet preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Platypi:wght@400..800&family=Atkinson+Hyperlegible+Next:wght@400..700&family=Atkinson+Hyperlegible+Mono:wght@400..600&display=swap">
<style>
  html,body{margin:0}
  body{padding:24px;background:var(--field);color:var(--on-field);font-family:var(--font-sans)}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}.lp-sheet{padding:var(--space-8)}
</style></head>
<body>
<div class="grid">
  <section class="lp-sheet">
    <h3 class="display-sm" style="margin:0 0 8px">A surface sheet</h3>
    <p style="margin:0 0 20px;color:var(--ink-muted)">Reading, product screens and forms.</p>
    <div class="lp-panel"><div class="lp-card">A card on a tinted panel</div></div>
  </section>
  <section class="lp-sheet lp-sheet--deep">
    <h3 class="display-sm" style="margin:0 0 8px">A deep sheet</h3>
    <p style="margin:0;color:var(--on-deep-muted)">Developer content and code. One per page.</p>
  </section>
</div>

</body>
</html>

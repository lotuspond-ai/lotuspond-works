<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tabs preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Platypi:wght@400..800&family=Atkinson+Hyperlegible+Next:wght@400..700&family=Atkinson+Hyperlegible+Mono:wght@400..600&display=swap">
<style>
  html,body{margin:0}
  body{padding:24px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  
</style></head>
<body>
<div class="lp-tabs" role="tablist" aria-label="Ways to connect">
  <button class="lp-tab" role="tab" aria-selected="true">API</button>
  <button class="lp-tab" role="tab" aria-selected="false" tabindex="-1">MCP</button>
  <button class="lp-tab" role="tab" aria-selected="false" tabindex="-1">Workspace</button>
</div>
<script>
  var tabs = [].slice.call(document.querySelectorAll('[role=tab]'));
  tabs.forEach(function (t) { t.addEventListener('click', function () {
    tabs.forEach(function (o) { o.setAttribute('aria-selected', String(o === t)); o.tabIndex = o === t ? 0 : -1; });
  }); });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Platypi:wght@400..800&family=Atkinson+Hyperlegible+Next:wght@400..700&family=Atkinson+Hyperlegible+Mono:wght@400..600&display=swap">
<style>
  html,body{margin:0}
  body{padding:24px;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .on-field{margin:24px -24px -24px;padding:24px;background:var(--field)}
</style></head>
<body>
<div class="row">
  <button class="lp-btn lp-btn--accent">Get early access <span aria-hidden="true">→</span></button>
  <button class="lp-btn lp-btn--ink">See what we build</button>
  <button class="lp-btn lp-btn--outline">Talk to us</button>
  <button class="lp-btn lp-btn--brand lp-btn--sm">Add release</button>
  <button class="lp-btn lp-btn--ink lp-btn--sm">Sign in</button>
</div>
<div class="row on-field">
  <button class="lp-btn lp-btn--ink">Get early access <span aria-hidden="true">→</span></button>
  <button class="lp-btn lp-btn--light">See the two products</button>
</div>

</body>
</html>

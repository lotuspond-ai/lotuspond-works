# Adapt to your authorized internal HTTPS endpoint and secret mounts.
# This is a configuration example, not a running monitoring service.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/lotuspond-alerts.yml

scrape_configs:
  - job_name: lotuspond-collector
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/lotuspond_collector_metrics_token
    static_configs:
      - targets: ['collector.example.internal:443']
    # For a private certificate authority, mount its CA and configure:
    # tls_config:
    #   ca_file: /run/secrets/internal_ca.pem
    # Do not disable certificate verification.

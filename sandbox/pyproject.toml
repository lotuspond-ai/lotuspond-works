[project]
name = "lotuspond-sandbox"
version = "0.1.0"
description = "Fail-closed Gym Anything sandbox launcher for Lotuspond"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
lotuspond-sandbox = "lotuspond_sandbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lotuspond_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]

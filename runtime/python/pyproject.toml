[project]
name = "lotuspond-runtime"
version = "0.1.0"
description = "Strict fleet identity and connection contracts for the Lotuspond Linux runtime"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["lotuspond-sdk==0.2.0", "pydantic>=2.12,<3", "rfc8785==0.1.4"]

[project.scripts]
lotuspond-runtime = "lotuspond_runtime.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lotuspond_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.sources]
lotuspond-sdk = { path = "../../sdk/python", editable = true }

[project]
name = "lotuspond-sdk"
version = "0.2.0"
description = "Bounded local v1 tooling and executable-v2 compilation and runtime contracts"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.12,<3", "cryptography>=50,<51", "rfc8785==0.1.4"]

[project.scripts]
lotuspond-package = "lotuspond_sdk.cli:main"

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lotuspond_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

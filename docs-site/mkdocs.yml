site_name: LotusPond Works Documentation
site_description: Install, operate, and evaluate agents with LotusPond Works
docs_dir: docs
site_dir: site
use_directory_urls: false
theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true
nav:
  - Start: index.md
  - Install: install.md
  - Authentication: authentication.md
  - Authenticator and recovery: mfa.md
  - Identity mail: identity-mail.md
  - API contracts: api.md
  - Package SDK and local trust: package-sdk.md
  - Executable definitions and contracts: executable-packages.md
  - Projects: projects.md
  - Evaluations: evaluations.md
  - Runtime identity foundation: runtime-foundation.md
  - Evaluation runners: runners.md
  - Administration: administration.md
  - Deployment: deployment.md
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
extra_css:
  - stylesheets/lotuspond.css

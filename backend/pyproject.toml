[project]
name = "lotuspond-api"
version = "0.4.0"
description = "Lotuspond agent automation platform API"
requires-python = ">=3.13"
dependencies = [
  "lotuspond-sdk==0.3.0",
  "lotuspond-runtime==0.2.0",
  "fastapi>=0.135,<1",
  "uvicorn[standard]>=0.41,<1",
  "sqlalchemy>=2.0.54,<2.1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "argon2-cffi>=25,<26",
  "httpx>=0.28,<1",
  "httpx2>=2.13,<3",
  "redis>=6,<9",
  "email-validator>=2.3,<3",
  "cryptography>=50,<51",
]

[project.scripts]
# The orchestrator and sweeper run from the API image, started explicitly by an
# operator; importing the API never starts one.
execution-worker = "lotuspond.execution_worker:main"

[dependency-groups]
dev = ["anthropic==2.3.0", "pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lotuspond"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.sources]
lotuspond-sdk = { path = "../sdk/python", editable = true }
lotuspond-runtime = { path = "../runtime/python", editable = true }

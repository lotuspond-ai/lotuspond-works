name: LotusPond Works validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      load:
        description: Also run durable execution tier 3 (about four hours)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: lotuspond
          POSTGRES_DB: lotuspond_platform_test
          POSTGRES_HOST_AUTH_METHOD: trust
          PGDATA: /var/lib/postgresql/18/docker
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.16'
      - run: uv sync --frozen --project backend
      - name: Check backend dependency metadata
        run: uv pip check --python backend/.venv/bin/python
      - run: npm ci
      - name: Check repository with independently verified execution test database
        env:
          LOTUSPOND_EXECUTION_TEST_DATABASE_URL: postgresql+psycopg://lotuspond@127.0.0.1:5432/lotuspond_platform_test
          LOTUSPOND_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          backend/.venv/bin/python - <<'PYCI'
          import os
          import subprocess
          from sqlalchemy import create_engine, text
          query = "SELECT current_database(), current_user, current_setting('data_directory'), system_identifier FROM pg_control_system()"
          expected = subprocess.check_output(
              ["docker", "exec", os.environ["LOTUSPOND_CI_POSTGRES_CONTAINER"], "psql", "-X", "-U", "lotuspond", "-d", "lotuspond_platform_test", "-Atc", query],
              text=True, timeout=30,
          ).strip().split("|")
          assert expected[:3] == ["lotuspond_platform_test", "lotuspond", "/var/lib/postgresql/18/docker"]
          engine = create_engine(os.environ["LOTUSPOND_EXECUTION_TEST_DATABASE_URL"], connect_args={"connect_timeout": 10}, hide_parameters=True)
          with engine.connect() as connection:
              connection.execute(text("SET statement_timeout='10s'"))
              assert list(map(str, connection.execute(text(query)).one())) == expected
          engine.dispose()
          print("Declared PostgreSQL test service and localhost client identity match")
          PYCI
          npm run check
      - run: backend/.venv/bin/python backend/export_schema.py --check
      - run: backend/.venv/bin/python -m pytest deploy/checks -q
      - name: Required PostgreSQL suite, installed fleet acceptance and supervised runner
        # A hang bound, not a speed target: with tests/execution the 998-test suite took
        # 29m22s on a fast hosted runner and projects to 34-38 min on slower ones
        # (docs/VALIDATION.md, 2026-10-22).
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          # A bridged service reports its bridge address to inet_server_addr().
          # Keep the smoke check's loopback guard and use a separate local-only DB.
          smoke_state=$(mktemp -d "$RUNNER_TEMP/lotuspond-runner-smoke.XXXXXX")
          cleanup() {
            local result=$?
            trap - EXIT
            if [[ -s "$smoke_state/container.id" ]]; then
              local container_id remaining
              container_id=$(<"$smoke_state/container.id")
              if ! docker rm --force --volumes "$container_id" >/dev/null; then
                result=1
              fi
              if ! remaining=$(docker ps --all --quiet --no-trunc --filter "id=$container_id"); then
                result=1
              elif [[ -n "$remaining" ]]; then
                echo "Runner smoke database cleanup could not be confirmed." >&2
                result=1
              fi
            fi
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          smoke_port=$(python -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          docker run --detach --pull=always --network host \
            --cidfile "$smoke_state/container.id" \
            --env POSTGRES_USER=lotuspond \
            --env POSTGRES_DB=lotuspond_platform_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --env PGDATA=/var/lib/postgresql/18/runner-smoke \
            postgres:18.6-alpine3.24 \
            -c listen_addresses=127.0.0.1 -c "port=$smoke_port" > "$smoke_state/start.log"
          smoke_ready=false
          for attempt in {1..60}; do
            if docker exec "$(<"$smoke_state/container.id")" pg_isready \
              -h 127.0.0.1 -p "$smoke_port" -U lotuspond -d lotuspond_platform_test >/dev/null 2>&1; then
              smoke_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$smoke_ready" != true ]]; then
            echo "The isolated runner smoke database did not become ready." >&2
            exit 1
          fi
          LOTUSPOND_PLATFORM_TEST_DATABASE_URL="postgresql+psycopg://lotuspond@127.0.0.1:$smoke_port/lotuspond_platform_test" \
          LOTUSPOND_FLEET_TEST_DATA_DIRECTORY=/var/lib/postgresql/18/runner-smoke \
            npm run test:python -- --basetemp="$RUNNER_TEMP/fleet-required-pytest" -ra -vv --durations=20 \
              --ignore=tests/execution/conformance --ignore=tests/execution/test_installed_acceptance.py
          LOTUSPOND_PLATFORM_TEST_DATABASE_URL="postgresql+psycopg://lotuspond@127.0.0.1:$smoke_port/lotuspond_platform_test" \
            backend/.venv/bin/python scripts/checks/runner-smoke.py \
              --expected-data-directory /var/lib/postgresql/18/runner-smoke \
              --report "$RUNNER_TEMP/lotuspond-runner-smoke.json"
      - name: Retain safe fleet qualification reports and actual distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-postgres-python-3.14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/fleet-required-pytest/**/fleet-report.json
            ${{ runner.temp }}/fleet-required-pytest/**/source-manifest.json
            ${{ runner.temp }}/fleet-required-pytest/**/outer-process-receipt.json
            ${{ runner.temp }}/fleet-required-pytest/**/outer-resource-outcome.json
            ${{ runner.temp }}/fleet-required-pytest/**/process-receipt.json
            ${{ runner.temp }}/fleet-required-pytest/**/cleanup.json
            ${{ runner.temp }}/fleet-required-pytest/**/schema-ownership.json
            ${{ runner.temp }}/fleet-required-pytest/**/worker-positive.json
            ${{ runner.temp }}/fleet-required-pytest/**/worker-phase-*-result.json
            ${{ runner.temp }}/fleet-required-pytest/**/worker-result.json
            ${{ runner.temp }}/fleet-required-pytest/**/sdk/*.whl
            ${{ runner.temp }}/fleet-required-pytest/**/runtime/*.whl
            ${{ runner.temp }}/fleet-required-pytest/**/runtime/*.tar.gz
            ${{ runner.temp }}/fleet-required-pytest/**/rebuilt/*.whl
            ${{ runner.temp }}/fleet-required-pytest/**/api/*.whl
      - name: Build API image with noneditable runtime dependency
        run: docker build -f deploy/Dockerfile -t lotuspond-api:e03-ci .
      - name: Check image metadata, imports and dependency consistency
        run: >-
          docker run --rm --network none --entrypoint python lotuspond-api:e03-ci -c
          'import importlib.metadata as m, json, pathlib, sys;
          import lotuspond.app, lotuspond_sdk, lotuspond_runtime.protocol;
          assert m.version("lotuspond-api") == "0.4.0";
          assert m.version("lotuspond-sdk") == "0.3.0";
          assert m.version("lotuspond-runtime") == "0.3.0";
          assert all(not json.loads(m.distribution(n).read_text("direct_url.json") or "{}").get("dir_info", {}).get("editable", False) for n in ("lotuspond-api", "lotuspond-sdk", "lotuspond-runtime"));
          assert pathlib.Path(lotuspond_sdk.__file__).is_relative_to(pathlib.Path(sys.prefix));
          assert pathlib.Path(lotuspond_runtime.__file__).is_relative_to(pathlib.Path(sys.prefix))'
      - name: Check durable execution packaging against the built image
        env:
          LOTUSPOND_API_IMAGE: lotuspond-api:e03-ci
          LOTUSPOND_REQUIRE_DURABLE_EXECUTION_TESTS: '1'
        run: backend/.venv/bin/python -m pytest scripts/checks -q -ra
      - name: Build operator docs strictly
        run: uv run --with mkdocs==1.6.1 mkdocs build --strict --config-file docs-site/mkdocs.yml --site-dir "$RUNNER_TEMP/lotuspond-docs"
  conformance:
    # Durable execution tier 1 and installed acceptance (Task 13): real API, worker and
    # runtime processes against isolated PostgreSQL. A job of its own, so the broad
    # PostgreSQL suite keeps its bound; the timeout is a hang bound from measured runs
    # (docs/validation/2026-10-15-durable-execution.md), not a speed target.
    runs-on: ubuntu-latest
    # Measured locally on 4 arm64 CPUs (2026-10-27): tier 1 38 min, installed
    # acceptance 1.5 min. About twice that, as a hang bound.
    timeout-minutes: 90
    env:
      LOTUSPOND_REQUIRE_DURABLE_EXECUTION_TESTS: '1'
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: lotuspond
          POSTGRES_DB: lotuspond_platform_test
          POSTGRES_HOST_AUTH_METHOD: trust
          PGDATA: /var/lib/postgresql/18/docker
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.16'
      - run: uv sync --frozen --project backend
      - name: Conformance tier 1 and installed acceptance, required
        working-directory: backend
        env:
          LOTUSPOND_PLATFORM_TEST_DATABASE_URL: postgresql+psycopg://lotuspond@127.0.0.1:5432/lotuspond_platform_test
        run: >-
          .venv/bin/python -m pytest tests/execution/conformance tests/execution/test_installed_acceptance.py
          --ignore=tests/execution/conformance/disruptive
          -ra -vv --durations=30 --basetemp="$RUNNER_TEMP/conformance"
      - name: Retain durable execution reports, receipts and distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-execution-conformance
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/conformance/**/execution-report.json
            ${{ runner.temp }}/conformance/**/source-manifest.json
            ${{ runner.temp }}/conformance/**/distribution-manifest.json
            ${{ runner.temp }}/conformance/**/outer-process-receipt.json
            ${{ runner.temp }}/conformance/**/process-receipt.json
            ${{ runner.temp }}/conformance/**/cleanup.json
            ${{ runner.temp }}/conformance/**/sdk/*.whl
            ${{ runner.temp }}/conformance/**/runtime/*.whl
            ${{ runner.temp }}/conformance/**/runtime/*.tar.gz
            ${{ runner.temp }}/conformance/**/rebuilt/*.whl
            ${{ runner.temp }}/conformance/**/api/*.whl
  disruptive:
    # Durable execution tier 2 (Task 13): each case owns a disposable postgres:18.6
    # container on a private loopback port, restarts it immediately, and backs it up
    # and restores it. Never port 5432, 55439 or a development database.
    runs-on: ubuntu-latest
    # Measured locally (2026-10-27): 2 min, most of it container start and restore.
    timeout-minutes: 20
    env:
      LOTUSPOND_REQUIRE_DURABLE_EXECUTION_TESTS: '1'
      LOTUSPOND_DISRUPTIVE_EXECUTION_TESTS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.16'
      - run: uv sync --frozen --project backend
      - run: docker pull postgres:18.6
      - name: Conformance tier 2, required
        working-directory: backend
        run: >-
          .venv/bin/python -m pytest tests/execution/conformance/disruptive
          -ra -vv --durations=10 --basetemp="$RUNNER_TEMP/disruptive"
      - name: Confirm every disposable cluster is gone
        if: always()
        run: test -z "$(docker ps --all --quiet --filter label=com.lotuspond.conformance)"
      - name: Retain the tier 2 report and cleanup receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-execution-disruptive
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/disruptive/execution-report.json
            ${{ runner.temp }}/disruptive/**/cleanup.json
  load:
    # Durable execution tier 3 (Task 13): the planning-target workload, run by hand on
    # recorded hardware. Never part of an ordinary push, pull request or re-run: only a
    # manual dispatch that asks for it.
    if: github.event_name == 'workflow_dispatch' && inputs.load
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.16'
      - run: uv sync --frozen --project backend
      - run: docker pull postgres:18.6
      - name: Planning-target load with its own disposable cluster
        working-directory: backend
        run: >-
          .venv/bin/python ../scripts/checks/execution-load.py
          --output "$RUNNER_TEMP/load" --work "$RUNNER_TEMP/load-work"
      - name: Confirm the load cluster is gone
        if: always()
        run: test -z "$(docker ps --all --quiet --filter label=com.lotuspond.conformance)"
      - name: Retain the load report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durable-execution-load
          if-no-files-found: error
          path: ${{ runner.temp }}/load/load-report.json
  sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.16'
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --project sdk/python
      - run: uv run --frozen --project sdk/python ruff check sdk/python
      - run: uv run --frozen --project sdk/python python -m lotuspond_sdk.executable.schema --check
      - run: uv build --project sdk/python
      - name: SDK suite and installed wheel/sdist-wheel CLI journeys
        run: uv run --frozen --project sdk/python pytest sdk/python/tests -q --basetemp="${{ runner.temp }}/sdk-artifacts"
      - name: Retain SDK artifact manifests and distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-artifacts-python-${{ matrix.python-version }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/sdk-artifacts/**/artifact-manifest.json
            ${{ runner.temp }}/sdk-artifacts/**/artifacts/*.whl
            ${{ runner.temp }}/sdk-artifacts/**/artifacts/*.tar.gz
            ${{ runner.temp }}/sdk-artifacts/**/rebuilt/*.whl
  runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.16'
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --project runtime/python
      - run: uv run --frozen --project runtime/python ruff check runtime/python
      - name: Runtime suite and independent installed wheel/sdist-wheel contracts
        run: uv run --frozen --project runtime/python pytest runtime/python/tests -q --basetemp="${{ runner.temp }}/runtime-artifacts"
      - name: Retain runtime artifact manifests and distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-artifacts-python-${{ matrix.python-version }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/runtime-artifacts/**/artifact-manifest.json
            ${{ runner.temp }}/runtime-artifacts/**/direct/*.whl
            ${{ runner.temp }}/runtime-artifacts/**/direct/*.tar.gz
            ${{ runner.temp }}/runtime-artifacts/**/sdk/*.whl
            ${{ runner.temp }}/runtime-artifacts/**/rebuilt/*.whl
  protocols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - run: npm ci --ignore-scripts
        working-directory: protocol-adapters
      - run: npm run check
        working-directory: protocol-adapters
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: docker pull postgres:18.6-alpine3.24
      - run: python deploy/checks/restore-smoke.py
  execution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Build the customer execution image
        run: docker build -f deploy/execution/Dockerfile -t lotuspond-execution:ci .
      - name: Probe the HTTP runner without a repository bind
        run: python deploy/checks/execution-smoke.py --image lotuspond-execution:ci
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install -r docs-site/requirements.txt
      - run: mkdocs build --strict --config-file docs-site/mkdocs.yml

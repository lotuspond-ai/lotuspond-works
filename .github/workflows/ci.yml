name: Lotuspond validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: lotuspond
          POSTGRES_DB: lotuspond_platform_test
          POSTGRES_HOST_AUTH_METHOD: trust
          PGDATA: /var/lib/postgresql/18/docker
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.16'
      - run: uv sync --frozen --project backend
      - name: Check backend dependency metadata
        run: uv pip check --python backend/.venv/bin/python
      - run: npm ci
      - run: npm run check
      - run: backend/.venv/bin/python backend/export_schema.py --check
      - run: PYTHONPATH=sandbox/src backend/.venv/bin/python -m pytest sandbox/tests -q
      - run: backend/.venv/bin/python -m pytest deploy/checks -q
      - name: Required PostgreSQL suite, installed fleet acceptance and supervised runner
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          # A bridged service reports its bridge address to inet_server_addr().
          # Keep the smoke check's loopback guard and use a separate local-only DB.
          smoke_state=$(mktemp -d "$RUNNER_TEMP/lotuspond-runner-smoke.XXXXXX")
          cleanup() {
            local result=$?
            trap - EXIT
            if [[ -s "$smoke_state/container.id" ]]; then
              local container_id remaining
              container_id=$(<"$smoke_state/container.id")
              if ! docker rm --force --volumes "$container_id" >/dev/null; then
                result=1
              fi
              if ! remaining=$(docker ps --all --quiet --no-trunc --filter "id=$container_id"); then
                result=1
              elif [[ -n "$remaining" ]]; then
                echo "Runner smoke database cleanup could not be confirmed." >&2
                result=1
              fi
            fi
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          smoke_port=$(python -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          docker run --detach --pull=always --network host \
            --cidfile "$smoke_state/container.id" \
            --env POSTGRES_USER=lotuspond \
            --env POSTGRES_DB=lotuspond_platform_test \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --env PGDATA=/var/lib/postgresql/18/runner-smoke \
            postgres:18.6-alpine3.24 \
            -c listen_addresses=127.0.0.1 -c "port=$smoke_port" > "$smoke_state/start.log"
          smoke_ready=false
          for attempt in {1..60}; do
            if docker exec "$(<"$smoke_state/container.id")" pg_isready \
              -h 127.0.0.1 -p "$smoke_port" -U lotuspond -d lotuspond_platform_test >/dev/null 2>&1; then
              smoke_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$smoke_ready" != true ]]; then
            echo "The isolated runner smoke database did not become ready." >&2
            exit 1
          fi
          LOTUSPOND_PLATFORM_TEST_DATABASE_URL="postgresql+psycopg://lotuspond@127.0.0.1:$smoke_port/lotuspond_platform_test" \
          LOTUSPOND_FLEET_TEST_DATA_DIRECTORY=/var/lib/postgresql/18/runner-smoke \
            npm run test:python -- --basetemp="$RUNNER_TEMP/fleet-required-pytest" -ra
          LOTUSPOND_PLATFORM_TEST_DATABASE_URL="postgresql+psycopg://lotuspond@127.0.0.1:$smoke_port/lotuspond_platform_test" \
            backend/.venv/bin/python scripts/checks/runner-smoke.py \
              --expected-data-directory /var/lib/postgresql/18/runner-smoke \
              --report "$RUNNER_TEMP/lotuspond-runner-smoke.json"
      - name: Retain safe fleet qualification reports and actual distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-postgres-python-3.14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/fleet-required-pytest/**/fleet-report.json
            ${{ runner.temp }}/fleet-required-pytest/**/source-manifest.json
            ${{ runner.temp }}/fleet-required-pytest/**/sdk/*.whl
            ${{ runner.temp }}/fleet-required-pytest/**/runtime/*.whl
            ${{ runner.temp }}/fleet-required-pytest/**/runtime/*.tar.gz
            ${{ runner.temp }}/fleet-required-pytest/**/rebuilt/*.whl
            ${{ runner.temp }}/fleet-required-pytest/**/api/*.whl
      - name: Build API image with noneditable runtime dependency
        run: docker build -f deploy/Dockerfile -t lotuspond-api:e03-ci .
      - name: Check image metadata, imports and dependency consistency
        run: >-
          docker run --rm --network none --entrypoint python lotuspond-api:e03-ci -c
          'import importlib.metadata as m, json, pathlib, sys;
          import lotuspond.app, lotuspond_sdk, lotuspond_runtime.protocol;
          assert m.version("lotuspond-sdk") == "0.2.0";
          assert m.version("lotuspond-runtime") == "0.1.0";
          assert all(not json.loads(m.distribution(n).read_text("direct_url.json") or "{}").get("dir_info", {}).get("editable", False) for n in ("lotuspond-api", "lotuspond-sdk", "lotuspond-runtime"));
          assert pathlib.Path(lotuspond_sdk.__file__).is_relative_to(pathlib.Path(sys.prefix));
          assert pathlib.Path(lotuspond_runtime.__file__).is_relative_to(pathlib.Path(sys.prefix))'
      - name: Build operator docs strictly
        run: uv run --with mkdocs==1.6.1 mkdocs build --strict --config-file docs-site/mkdocs.yml --site-dir "$RUNNER_TEMP/lotuspond-docs"
  sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.16'
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --project sdk/python
      - run: uv run --frozen --project sdk/python ruff check sdk/python
      - run: uv run --frozen --project sdk/python python -m lotuspond_sdk.executable.schema --check
      - run: uv build --project sdk/python
      - name: SDK suite and installed wheel/sdist-wheel CLI journeys
        run: uv run --frozen --project sdk/python pytest sdk/python/tests -q --basetemp="${{ runner.temp }}/sdk-artifacts"
      - name: Retain SDK artifact manifests and distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-artifacts-python-${{ matrix.python-version }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/sdk-artifacts/**/artifact-manifest.json
            ${{ runner.temp }}/sdk-artifacts/**/artifacts/*.whl
            ${{ runner.temp }}/sdk-artifacts/**/artifacts/*.tar.gz
            ${{ runner.temp }}/sdk-artifacts/**/rebuilt/*.whl
  runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.16'
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --project runtime/python
      - run: uv run --frozen --project runtime/python ruff check runtime/python
      - name: Runtime suite and independent installed wheel/sdist-wheel contracts
        run: uv run --frozen --project runtime/python pytest runtime/python/tests -q --basetemp="${{ runner.temp }}/runtime-artifacts"
      - name: Retain runtime artifact manifests and distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-artifacts-python-${{ matrix.python-version }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/runtime-artifacts/**/artifact-manifest.json
            ${{ runner.temp }}/runtime-artifacts/**/direct/*.whl
            ${{ runner.temp }}/runtime-artifacts/**/direct/*.tar.gz
            ${{ runner.temp }}/runtime-artifacts/**/sdk/*.whl
            ${{ runner.temp }}/runtime-artifacts/**/rebuilt/*.whl
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: collector/go.mod
          cache: false
      - run: go test -race ./...
        working-directory: collector
  monitoring-rules:
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_IMAGE: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate scrape configuration and alert timing
        run: |
          docker pull "$PROMETHEUS_IMAGE"
          docker run --rm --network none --entrypoint /bin/promtool -v "$PWD/deploy/monitoring:/work:ro" -w /work "$PROMETHEUS_IMAGE" check config --syntax-only prometheus.example.yml
          docker run --rm --network none --entrypoint /bin/promtool -v "$PWD/deploy/monitoring:/work:ro" -w /work "$PROMETHEUS_IMAGE" check rules lotuspond-alerts.yml
          docker run --rm --network none --entrypoint /bin/promtool -v "$PWD/deploy/monitoring:/work:ro" -w /work "$PROMETHEUS_IMAGE" test rules alerts.test.yml
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - run: npm ci --ignore-scripts
        working-directory: voice-bridge
      - run: npm run check
        working-directory: voice-bridge
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cargo test --locked
        working-directory: evidence-core
  protocols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
      - run: npm ci --ignore-scripts
        working-directory: protocol-adapters
      - run: npm run check
        working-directory: protocol-adapters
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: docker pull postgres:18.6-alpine3.24
      - run: python deploy/checks/restore-smoke.py
  execution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Build the customer execution image
        run: docker build -f deploy/execution/Dockerfile -t lotuspond-execution:ci .
      - name: Probe HTTP, MCP, and airgap voice without a repository bind
        run: python deploy/checks/execution-smoke.py --image lotuspond-execution:ci
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install -r docs-site/requirements.txt
      - run: mkdocs build --strict --config-file docs-site/mkdocs.yml
  offline-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Build the reviewed bundle
        run: deploy/airgap/build-bundle.sh ci "$RUNNER_TEMP/lotuspond-airgap-ci.tar.gz"
      - name: Install and exercise the bundle in an internal-only test network
        run: python deploy/checks/airgap-smoke.py "$RUNNER_TEMP/lotuspond-airgap-ci.tar.gz" "$RUNNER_TEMP/lotuspond-airgap-ci.tar.gz.sha256" --failure-recovery

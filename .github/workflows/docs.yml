name: Lotuspond documentation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs-site/**', '.github/workflows/docs.yml']
permissions:
  contents: read
concurrency:
  group: lotuspond-docs
  cancel-in-progress: true
jobs:
  build:
    if: vars.LOTUSPOND_DOCS_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install -r docs-site/requirements.txt
      - run: mkdocs build --strict --config-file docs-site/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

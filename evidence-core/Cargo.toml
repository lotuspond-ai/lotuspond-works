[package]
name = "lotuspond-evidence"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Deterministic SHA-256 artifact manifests and Ed25519 publisher signatures for Lotuspond"

[dependencies]
ed25519-dalek = { version = "=3.0.0", features = ["pem"] }
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
zeroize = "=1.9.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
